  <script>
    (function () {
      var a = document.getElementById("brief");
      var hint = document.getElementById("hint");
      if (!a) return;
      var started = false;
      function tryPlay() {
        if (started) return;
        var p = a.play();
        if (p && p.then) {
          p.then(function () {
            started = true;
            if (hint) hint.style.display = "none";
          }).catch(function () {
            if (hint) hint.style.display = "block";
          });
        }
      }
      a.autoplay = true;
      a.preload = "auto";
      try { a.load(); } catch (e) {}
      ["canplay", "canplaythrough", "loadeddata"].forEach(function (ev) {
        a.addEventListener(ev, tryPlay);
      });
      document.addEventListener("DOMContentLoaded", tryPlay);
      window.addEventListener("load", tryPlay);
      ["pointerdown", "touchstart", "click", "scroll"].forEach(function (ev) {
        document.addEventListener(ev, tryPlay, { capture: true, passive: true });
      });
      setTimeout(tryPlay, 300);
    })();
  </script>
